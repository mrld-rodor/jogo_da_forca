name: Build executaveis

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: JogoDaForca-windows
            ficheiro: dist/JogoDaForca.exe
          - os: ubuntu-22.04
            artefacto: JogoDaForca-linux
            ficheiro: dist/JogoDaForca
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar executavel
        run: pyinstaller --noconfirm JogoDaForca.spec

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.ficheiro }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Preparar ficheiros
        run: |
          mkdir release
          cp artefactos/JogoDaForca-windows/JogoDaForca.exe release/
          cp artefactos/JogoDaForca-linux/JogoDaForca release/JogoDaForca-linux
          chmod +x release/JogoDaForca-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
